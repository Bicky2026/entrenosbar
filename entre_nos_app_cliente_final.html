
<!doctype html>
<html lang='es'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Entre Nos – Pedido Cliente</title>
<style>
body{margin:0; font-family:Arial; background:#0b0c10; color:#e9eef2;}
h1{text-align:center; padding:16px;}
.grid{display:flex; flex-wrap:wrap; justify-content:center; gap:16px; padding-bottom:90px;}
.card{background:#12151a; width:300px; border:1px solid #1d232d; border-radius:14px; overflow:hidden;}
.thumb{width:100%; height:200px; object-fit:cover;}
.body{padding:14px; display:flex; flex-direction:column; gap:10px;}
.title{font-size:20px; font-weight:700;}
.muted{color:#aab4be; font-size:14px;}
.stars{color:#ffcc00; font-size:22px; cursor:pointer;}
.btn{background:#ff6b35; border:0; padding:10px; border-radius:8px; width:100%; color:white; font-size:15px; cursor:pointer;}
.qty{width:60px; padding:6px; border-radius:6px; background:#0f1217; color:white; border:1px solid #242a33;}
.note{width:100%; min-height:40px; padding:8px; border-radius:6px; background:#0f1217; border:1px solid #242a33; color:white;}
#sendBox{position:fixed; bottom:0; left:0; right:0; background:#12151a; padding:14px; border-top:1px solid #1d232d;}
.inputName{width:100%; padding:10px; background:#0f1217; border:1px solid #242a33; border-radius:8px; color:white;}
</style>
</head>
<body>
<h1>🍹 ENTRE NOS — HACÉ TU PEDIDO</h1>
<div style='padding:0 16px 16px;'>
  <label>Tu nombre:</label>
  <input id='clientName' class='inputName' placeholder='Escribí tu nombre...'>
</div>
<div class='grid' id='grid'></div>
<div id='sendBox'>
  <button class='btn' onclick='sendWA()'>Enviar pedido por WhatsApp</button>
</div>
<script>
const WHATSAPP = "59898709156";
const items = [
{id:1,nombre:"Aperol Coconut Margarita",precio:300,descripcion:"Refrescante, cítrica y cremosa con coco.",ing:["Tequila","Aperol","Leche de coco","Jugo de Lima", "Orgeat"],foto:"https://images.unsplash.com/photo-1500217052183-bc01eee1a74e"},
{id:2,nombre:"Aperolada",precio:500,descripcion:"Dulce, sedosa y frutal.",ing:["Aperol","Orgeat","Leche de coco","Ananá"],foto:"https://images.unsplash.com/photo-1512103865222-dcf9531c9961"},
{id:3,nombre:"Pomelo Grove",precio:100,descripcion:"Cítrico y herbal.",ing:["Gin","Syrup romero","Cerveza pomelo"],foto:"https://images.pexels.com/photos/605408/pexels-photo-605408.jpeg"},
{id:4,nombre:"Whisky Tropical",precio:310,descripcion:"Intenso y frutal.",ing:["Whisky","Jugo de Limón","Jugo de Piña","Syrup Simple"],foto:"https://images.unsplash.com/photo-1500217052183-bc01eee1a74e"},
{id:5,nombre:"Blueberry Gin & Tonic",precio:130,descripcion:"Aromático, fresco y dulce.",ing:["Gin","Syrup arándanos","Tónica"],foto:"https://cdn.pixabay.com/photo/2023/10/11/10/45/cocktail-8308286_1280.jpg"},
{id:6,nombre:"Painkiller",precio:280,descripcion:"Cremoso y tropical.",ing:["Ron añejo","Syrup de Coco","Jugo de Piña; "Jugo de Naranja""],foto:"https://images.pexels.com/photos/452737/pexels-photo-452737.jpeg"},
{id:7,nombre:"Rum Barrel",precio:240,descripcion:"Frutal y cítrico.",ing:["Ron añejo","Jugo de Lima","Jugo de Naranja", "Syrup de Maracuyá"],foto:"https://images.unsplash.com/photo-1512103865222-dcf9531c9961"}
];
let pedido = [];
function getRating(id){return Number(localStorage.getItem("rating_"+id) || 0);} 
function setRating(id,val){localStorage.setItem("rating_"+id,val); render();}
function starsHTML(id){let r=getRating(id); let h=""; for(let i=1;i<=5;i++){h+=`<span class='stars' onclick='setRating(${id},${i})'>${i<=r?"★":"☆"}</span>`;} return h;}
function render(){document.getElementById("grid").innerHTML=items.map(it=>`
 <div class='card'>
  <img class='thumb' src='${it.foto}'>
  <div class='body'>
    <div class='title'>${it.nombre}</div>
    <div class='muted'>${it.descripcion}</div>
    <div>${starsHTML(it.id)}</div>
    <button class='btn' onclick='toggleIng(${it.id})'>Ver ingredientes</button>
    <div id='ing_${it.id}' style='display:none; color:#aab4be; padding-top:6px;'>${it.ing.map(x=>"• "+x).join('<br>')}</div>
    <textarea id='note_${it.id}' class='note' placeholder='Nota (opc)'></textarea>
    <div style='display:flex; gap:8px;'>
      <input id='qty_${it.id}' type='number' min='1' value='1' class='qty'>
      <button class='btn' onclick='add(${it.id})'>Agregar</button>
    </div>
  </div>
 </div>`).join("");}
function toggleIng(id){let b=document.getElementById("ing_"+id); b.style.display=b.style.display==="none"?"block":"none";}
function add(id){let it=items.find(x=>x.id===id); let qty=Number(document.getElementById("qty_"+id).value); let note=document.getElementById("note_"+id).value.trim(); pedido.push({nombre:it.nombre,qty,note}); alert("✅ Agregado: "+it.nombre);} 
function sendWA(){ if(!pedido.length){alert("Agregá al menos un trago."); return;} let nombre=document.getElementById("clientName").value.trim(); let header=nombre?`Pedido de ${nombre}%0A`:""; let txt=pedido.map(l=>`${l.qty}× ${l.nombre}${l.note?" ("+l.note+")":""}`).join('%0A'); window.open(`https://wa.me/${WHATSAPP}?text=${header}${txt}`); }
render();
</script>
</body>
</html>
