<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Entre Nos - Pedidos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
  font-family: Arial;
  margin: 20px;
  background:#111;
  color:#fff;
}

h1 {
  text-align:center;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fit,minmax(250px,1fr));
  gap:15px;
}

.card {
  background:#222;
  padding:10px;
  border-radius:10px;
  transition: transform 0.2s;
}

.card:hover {
  transform: scale(1.02);
}

.card img {
  width:100%;
  border-radius:10px;
}

button {
  margin-top:10px;
  padding:10px;
  width:100%;
  border:none;
  border-radius:8px;
  background:#25D366;
  color:white;
  font-weight:bold;
  cursor:pointer;
}

#pedido {
  margin-top:20px;
  background:#222;
  padding:10px;
  border-radius:10px;
}

input {
  width:100%;
  padding:10px;
  border-radius:8px;
  border:none;
  margin-top:15px;
}

small {
  display:block;
  margin-top:5px;
  opacity:0.7;
}
</style>
</head>

<body>

<h1>🍹 ENTRE NOS — HACÉ TU PEDIDO</h1>

<div class="grid" id="productos"></div>

<h2>🧾 Tu pedido</h2>
<div id="pedido"></div>

<input id="cliente" placeholder="Tu nombre">

<button onclick="enviarWhatsApp()">Enviar por WhatsApp</button>

<script>
const WHATSAPP = "59898709156";

const items = [
{
id:1,
nombre:"Aperol Coconut Margarita",
descripcion:"Equilibrio entre acidez y dulzor.",
ing:["Tequila","Aperol","Leche de coco","Jugo de Lima"],
foto:"AperolCoconutMargarita.jpeg"
},
{
id:2,
nombre:"Aperolada",
descripcion:"Intensa y sedosa, con coco y notas dulces, ALERGENOS: frutos secos.",
ing:["Tequila","Aperol","Orgeat","Leche de coco","Ananá"],
foto:"Aperolada.jpeg"
},
{
id:3,
nombre:"Pomelo Grove",
descripcion:"Refrescante y herbal.",
ing:["Gin","Syrup de Romero","Cerveza pomelo"],
foto:"PomeloGrove.jpeg"
},
{
id:4,
nombre:"Whisky Tropical",
descripcion:"Suave y equilibrado.",
ing:["Whisky","Jugo de Limón","Jugo de Piña","Syrup Simple"],
foto:"Whiskytropical.jpeg"
},
{
id:5,
nombre:"Blueberry Gin Tonic",
descripcion:"Fresco y cítrico.",
ing:["Gin","Syrup de Arándanos","Jugo de Lima","Tónica"],
foto:"BlueberryGinTonic.jpeg"
},
{
id:6,
nombre:"Painkiller",
descripcion:"Cremoso y tropical.",
ing:["Ron añejo","Syrup de Coco","Piña","Naranja"],
foto:"Painkiller.jpeg"
},
{
id:7,
nombre:"Rum Barrel",
descripcion:"Cítrico y vibrante.",
ing:["Ron Añejo","Lima","Naranja","Syrup de Maracuyá"],
foto:"RumBarrel.jpeg"
}
];

let pedido = [];

// Render productos
function renderProductos(){
  const cont = document.getElementById("productos");
  cont.innerHTML = "";

  items.forEach(item => {
    const div = document.createElement("div");
    div.className = "card";

    div.innerHTML = `
      <img src="${item.foto}" loading="lazy">
      <h3>${item.nombre}</h3>
      <p>${item.descripcion}</p>
      <small>${item.ing.join(" • ")}</small>
      <button onclick="agregarAlPedido(${item.id})">Agregar</button>
    `;

    cont.appendChild(div);
  });
}

// Agregar producto
function agregarAlPedido(id){
  const item = items.find(i => i.id === id);
  if(!item) return;

  const existente = pedido.find(p => p.id === id);

  if(existente){
    existente.cantidad++;
  } else {
    pedido.push({id:item.id,nombre:item.nombre,cantidad:1});
  }

  renderPedido();
}

// Render pedido
function renderPedido(){
  const cont = document.getElementById("pedido");
  cont.innerHTML = "";

  pedido.forEach(p => {
    const div = document.createElement("div");
    div.textContent = `${p.nombre} x${p.cantidad}`;
    cont.appendChild(div);
  });
}

// Enviar WhatsApp
function enviarWhatsApp(){
  if(pedido.length === 0){
    alert("Tu pedido está vacío");
    return;
  }

  const cliente = document.getElementById("cliente").value.trim();

  if(cliente === ""){
    alert("Por favor ingresá tu nombre");
    return;
  }

  let mensaje = `Hola! Soy ${cliente} y quiero pedir:\n`;

  pedido.forEach(p => {
    mensaje += `- ${p.nombre} x${p.cantidad}\n`;
  });

  const url = `https://wa.me/${WHATSAPP}?text=${encodeURIComponent(mensaje)}`;
  window.open(url, "_blank");
}

// Inicio seguro
document.addEventListener("DOMContentLoaded", () => {
  renderProductos();
});
</script>

</body>
</html>
